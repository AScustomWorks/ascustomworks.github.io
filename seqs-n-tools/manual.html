<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AS Seqs &amp; Tools Manual | AS Custom Works</title>
  <meta name="description" content="User manual of AS Seqs & Tools, sequencer and utility modules for VCV Rack by AS Custom Works.">
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0e10;
      --panel: rgba(34, 35, 37, 0.92);
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --title: #c0463b;
      --link: #f0b27a;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg) url("img/bg.jpg") center top / cover fixed no-repeat;
      line-height: 1.55;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

    header { text-align: center; padding: 32px 0 16px; }
    header img { width: 200px; max-width: 60%; height: auto; }
    nav { display: flex; justify-content: flex-end; gap: 20px; margin-top: 16px; font-size: 1.1rem; }
    nav a { color: var(--text); }
    nav a[aria-current] { color: var(--link); }

    section {
      background: var(--panel);
      margin: 24px 0;
      padding: 28px 32px;
    }
    h1, h2 { color: var(--title); font-weight: 700; margin: 0 0 12px; }
    h1 { font-size: 1.75rem; text-align: center; }
    h2 { font-size: 1.6rem; }
    h4, h5 { color: var(--link); font-size: 1.15rem; margin: 20px 0 6px; }
    p, li { font-size: 1.08rem; }
    ul { padding-left: 22px; }
    li { margin: 0 0 6px; }
    strong { font-weight: 700; }

    .intro p { text-align: center; font-weight: 600; }
    .print-btn { display: block; margin: 16px auto 0; font: inherit; font-size: 1rem; color: var(--bg); background: var(--link); border: 0; padding: 8px 18px; cursor: pointer; }

    .toc h2 { font-size: 1.3rem; }
    .toc .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 24px; }
    .toc h3 { color: var(--title); font-size: 1.05rem; margin: 8px 0 4px; }
    .toc ul { list-style: none; padding: 0; margin: 0; }
    .toc li { margin: 0 0 2px; font-size: 1.02rem; }

    .module .slug { color: var(--muted); font-size: 0.95rem; margin: -8px 0 12px; }
    .module .top { font-size: 0.95rem; text-align: right; margin: 16px 0 0; }
    .error { color: var(--link); }

    .links { text-align: center; font-size: 1.1rem; margin: 24px 0; }
    footer { text-align: center; color: var(--muted); padding: 48px 0 32px; }

    @media (max-width: 640px) {
      nav { justify-content: center; }
      section { padding: 20px 16px; }
      h1 { font-size: 1.4rem; }
      h2 { font-size: 1.3rem; }
    }

    /* Printing or saving as PDF from the browser: plain black on white, one module per page */
    @media print {
      body { background: #fff; color: #000; }
      a { color: #000; }
      header nav, .print-btn, .toc, .module .top, .links, footer { display: none; }
      header { padding: 0 0 8px; }
      header img { width: 120px; }
      section { background: none; padding: 0; margin: 0 0 16px; }
      h1, h2 { color: #000; }
      h4, h5 { color: #333; }
      .module { break-before: page; }
      .module .slug { color: #555; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="img/logo.png" alt="AS Custom Works" width="200" height="170">
      <nav>
        <a href="./" aria-current="page">AS Seqs &amp; Tools</a>
        <a href="../drums-n-filters/">AS Drums &amp; Filters</a>
      </nav>
    </header>

    <section class="intro">
      <h1>AS Seqs &amp; Tools &mdash; User manual</h1>
      <div id="plugin-intro"></div>
      <button class="print-btn" type="button" onclick="window.print()">Print or save as PDF</button>
    </section>

    <section class="toc">
      <h2>Modules</h2>
      <div class="groups" id="toc"></div>
    </section>

    <div id="modules"></div>

    <div class="links">
      <p><a href="./">Back to AS Seqs &amp; Tools</a></p>
    </div>

    <footer>&copy; 2017&ndash;2026 AS Custom Works</footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script>
    // The manuals are the same Markdown files that ship with the plugin (manual/<slug>.md).
    var GROUPS = [
      { title: "Sequencers", modules: [
        ["ReCon", "ReCon"], ["ReStepOne", "ReStepOne"], ["ReStep", "ReStep"] ] },
      { title: "Triggers and clock", modules: [
        ["ReBeat", "ReBeat"], ["ReBit", "ReBit"], ["ReGate", "ReGate"], ["ReSwing", "ReSwing"] ] },
      { title: "Notes", modules: [
        ["ReQ", "ReQ"], ["ReNote", "ReNote"], ["ReKey", "ReKey"] ] },
      { title: "Random and switching", modules: [
        ["ReFluke", "ReFluke"], ["ReFlip", "ReFlip"], ["aBy", "A-B-Y Switch"] ] }
    ];

    function load(slug) {
      return fetch("manual/" + slug + ".md").then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      });
    }

    // links between manuals ("ReStep.md#manual") point to the section on this page
    function fixLinks(el) {
      el.querySelectorAll("a[href]").forEach(function (a) {
        var m = a.getAttribute("href").match(/^([\w-]+)\.md(#.*)?$/);
        if (m) a.setAttribute("href", "#" + m[1]);
      });
    }

    var toc = document.getElementById("toc");
    var container = document.getElementById("modules");
    var all = [];
    GROUPS.forEach(function (g) {
      var div = document.createElement("div");
      var h = document.createElement("h3");
      h.textContent = g.title;
      var ul = document.createElement("ul");
      g.modules.forEach(function (m) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = "#" + m[0];
        a.textContent = m[1];
        li.appendChild(a);
        ul.appendChild(li);

        var sec = document.createElement("section");
        sec.className = "module";
        sec.id = m[0];
        var h2 = document.createElement("h2");
        h2.textContent = m[1];
        var body = document.createElement("div");
        var top = document.createElement("p");
        top.className = "top";
        top.innerHTML = '<a href="#toc">Back to the module list</a>';
        sec.appendChild(h2);
        sec.appendChild(body);
        sec.appendChild(top);
        container.appendChild(sec);
        all.push([m[0], body]);
      });
      div.appendChild(h);
      div.appendChild(ul);
      toc.appendChild(div);
    });

    load("plugin").then(function (md) {
      var el = document.getElementById("plugin-intro");
      el.innerHTML = marked.parse(md);
      fixLinks(el);
    }).catch(function () {});

    Promise.all(all.map(function (entry) {
      return load(entry[0]).then(function (md) {
        entry[1].innerHTML = marked.parse(md);
        fixLinks(entry[1]);
      }).catch(function () {
        entry[1].innerHTML = '<p class="error">This manual could not be loaded.</p>';
      });
    })).then(function () {
      // jump to the module in the address (manual.html#ReQ) once everything is in place
      if (location.hash) {
        var target = document.getElementById(location.hash.slice(1));
        if (target) target.scrollIntoView();
      }
    });
  </script>
</body>
</html>
